---
packages:
  - app
  - packages/*

# Centralized versions for dependencies shared across the workspace.
# Reference them with "catalog:" in each package.json so a single bump
# here keeps app and all libs in sync (prevents duplicate-version issues).
catalog:
  "@reduxjs/toolkit": ^2.12.0
  "@testing-library/react": ^16.3.2
  "@types/node": ^24.13.3
  camelcase-keys: ^10.0.2
  i18next: ^26.3.6
  msw: ^2.15.0
  react: ^19.2.8
  react-dom: ^19.2.8
  react-redux: ^9.3.0
  react-router-dom: 7.18.0
  snakecase-keys: ^9.0.2
  typescript: ^6.0.3
  uuid: ^14.0.1
  vite: ^7.3.6
  vite-plugin-dts: ^4.5.4

onlyBuiltDependencies:
  - msw

# can be removed when the following issue with tinypool is resolved:
# https://github.com/vitest-dev/vitest/issues/8201
overrides:
  "vitest>tinypool": 1.0.2
