packages:
  - app
  - packages/*

# Centralized versions for dependencies shared across the workspace.
# Reference them with "catalog:" in each package.json so a single bump
# here keeps app and all libs in sync (prevents duplicate-version issues).
catalog:
  "@reduxjs/toolkit": ^2.12.0
  "@testing-library/react": ^16.3.2
  "@types/node": ^24.13.3
  camelcase-keys: ^10.0.2
  i18next: ^26.3.6
  msw: ^2.15.0
  react: ^19.2.8
  react-dom: ^19.2.8
  react-redux: ^9.3.0
  react-router-dom: 7.18.0
  snakecase-keys: ^9.0.2
  typescript: ^6.0.3
  uuid: ^14.0.1
  vite: ^8.2.2
  vite-plugin-dts: ^4.5.4

overrides:
  dompurify@<3.4.13: '>=3.4.13'
  lodash-es@<4.17.23: '>=4.17.23'
  mermaid@>=11.0.0-alpha.1 <11.16.1: '>=11.16.1'
  nanoid@<5.1.16: '>=5.1.16'
  react-router@>=7.12.0 <7.18.2: '>=7.18.2'

nodeLinker: hoisted

allowBuilds:
  msw: false
  '@sentry/cli': false
  core-js: false
  esbuild: false
