---
spec:
  inputs:
    release_version:
      description: |
        Version number, e.g. `1.2.3`. Must be in format `<major>.<minor>.<patch>`.
        Keep at `0.0.0` unless you're in the process of creating a release.
      type: string
      regex: ^([0]|([1-9]\d*))\.([0]|([1-9]\d*))\.([0]|([1-9]\d*))$
      default: 0.0.0
    release_issue:
      description: |
        The number of an issue which should be closed by a release MR created by this pipeline.
        Keep empty or unset unless you're in the process of creating a release.
      type: string
      regex: ^\d*$
      default: ''
---
default:
  image: node:24.16.0-alpine

stages:
  - analyze
  - lint
  - trigger
  - test
  - prepare-artifact
  - build
  - package
  - push
  - scan
  - e2e
  - review-app
  - cleanup
  - release

variables:
  BUILDAH_IMAGE: quay.io/buildah/stable:v1.43
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.20

.build-branch-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "feature/roomserver"

.setup-pnpm: &setup-pnpm
  - npm install -g corepack@latest
  - corepack enable
  - |
    PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
    corepack prepare "pnpm@$PNPM_VERSION" --activate
  - pnpm config set store-dir .pnpm-store

.upload-sourcemaps: &upload-sourcemaps
  - |
    if [ -n "${CI_COMMIT_TAG:-}" ] && [ "$CI_PROJECT_ROOT_NAMESPACE" = "opentalk" ]; then
      pnpm add -w @sentry/cli
      {
        echo "[ defaults ]"
        echo "org=${GLITCHTIP_ORG}"
        echo "project=${GLITCHTIP_PROJECT}"
      } >> .sentryclirc
      node_modules/.bin/sentry-cli sourcemaps inject "$DIST_DIR"
      node_modules/.bin/sentry-cli --url "$GLITCHTIP_URL" login --auth-token "$GLITCHTIP_AUTH_TOKEN"
      node_modules/.bin/sentry-cli sourcemaps upload --release "$CI_COMMIT_TAG" "$DIST_DIR"
    fi

.strip-sourcemaps: &strip-sourcemaps
  - |
    find "$DIST_DIR" -name '*.map' -type f -delete
    if find "$DIST_DIR" -name '*.map' -type f | grep -q .; then
      echo "ERROR: source maps present in $DIST_DIR" >&2
      exit 1
    fi
    if grep -rl "sourceMappingURL" "$DIST_DIR" -e '*.js' 2> /dev/null; then
      echo "ERROR: sourceMappingURL reference present in $DIST_DIR" >&2
      exit 1
    fi

include:
  - project: opentalk/ci/templates/collect-commit-evidence
    ref: v2
    file: .gitlab-ci-template.yml
  - project: opentalk/ci/templates/release-creation
    inputs:
      version: $[[ inputs.release_version ]]
      issue: $[[ inputs.release_issue]]
    ref: v1
    file: .gitlab-ci-template.yml
  - project: opentalk/ci/templates/changelog
    ref: v2
    file: .gitlab-ci-template.yml

code-review-agent:
  stage: analyze
  image:
    name: pragent/pr-agent:0.42.0
    entrypoint: ['']
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - echo "Running PR Agent..."
    - export MR_URL="$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
    - echo "MR_URL=$MR_URL"
    - export GITLAB__URL="$CI_SERVER_URL"
    - export CONFIG__GIT_PROVIDER="gitlab"
    - export GITLAB__AUTH_TYPE="private_token"

    - test -n "$PR_AGENT_ACCESS_TOKEN" || { echo "PR_AGENT_ACCESS_TOKEN is not set"; exit 1; }
    - export GITLAB__PERSONAL_ACCESS_TOKEN="$PR_AGENT_ACCESS_TOKEN"

    - test -n "$PR_AGENT_ANTHROPIC_KEY" || { echo "PR_AGENT_ANTHROPIC_KEY is not set"; exit 1; }
    - export ANTHROPIC__KEY="$PR_AGENT_ANTHROPIC_KEY"

    - python -m pr_agent.cli --extra_config_url=.pr_agent.toml --pr_url="$MR_URL" review
    - python -m pr_agent.cli --extra_config_url=.pr_agent.toml --pr_url="$MR_URL" improve

prettier+eslint:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - *setup-pnpm
  script:
    - pnpm install
    - pnpm lint
    - pnpm fmt:ci

fast-typescript-analyzer:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - npx --yes fta-cli --format json --score-cap 1000 . > ./fta-report.json
    - npx --yes fta-cli --format table --score-cap 1000 .
    - npx --yes fta-cli .
  artifacts:
    when: always
    paths:
      - fta-report.json

typecheck:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - *setup-pnpm
  script:
    - pnpm install
    - pnpm build:libs
    - pnpm typecheck

circular-deps:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - *setup-pnpm
  script:
    - pnpm install
    - pnpm deps:circular

yaml:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - apk add --no-cache yamllint
  script: yamllint .

compliance:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - apk add --no-cache git
    - *setup-pnpm
    - pnpm install
  script:
    - pnpm licensee --production --errors-only

licensing:
  stage: lint
  image:
    name: fsfe/reuse:6.2.0
    entrypoint: ['']
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - reuse lint

audit:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - *setup-pnpm
  script:
    - pnpm audit --prod
  allow_failure: true

commit:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - apk add --no-cache git
    - npm install -g @commitlint/cli @commitlint/config-conventional
  script:
    - npx commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA --to HEAD --verbose

unused-deps:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - apk add --no-cache git
    - *setup-pnpm
    - pnpm install
  script:
    - pnpm knip --include dependencies

unused-files:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - apk add --no-cache git
    - *setup-pnpm
    - pnpm install
  script:
    - pnpm knip --include files

commit-signature:
  stage: lint
  needs: []
  rules:
    # Run in merge requests only.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - apk add --no-cache git gnupg
  script:
    # %G? will log signature information for a commit. `N` stands for "no signature", `B` for "bad signature"
    # refer to https://git-scm.com/docs/pretty-formats#Documentation/pretty-formats.txt-emGem
    # grep checks that the output does not contain any "N" or "B" characters.
    - >
      git log --format=format:'%G?' $CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD
      | tr -d '\n'
      | grep -q -v -e "N" -e "B"

unit-tests:
  stage: test
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG && $CI_PROJECT_ROOT_NAMESPACE == 'opentalk'
  before_script:
    - apk add --no-cache git
    - *setup-pnpm
    - pnpm install
  script:
    - pnpm test:unit:ci
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  coverage: /All files[^\|]*\|[^\|]*\s+([\d\.]+)/

build:
  stage: prepare-artifact
  variables:
    DIST_DIR: dist
  rules:
    - !reference [.build-branch-rules, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG && $CI_PROJECT_ROOT_NAMESPACE == 'opentalk'
  before_script:
    - apk add git jq
    - *setup-pnpm
    - pnpm install
  script:
    - pnpm build
    - echo v$(jq -r '.version' ./app/package.json) > ./dist/FRONTEND_VERSION
    - *upload-sourcemaps
    - *strip-sourcemaps
  artifacts:
    paths:
      - dist/*
    expire_in: 1 days

build-profiling:
  stage: prepare-artifact
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG && $CI_PROJECT_ROOT_NAMESPACE == 'opentalk'
  before_script:
    - apk add git jq
    - *setup-pnpm
    - pnpm install
  script:
    - pnpm build:profiling
    - jq -r '.version' ./app/package.json > ./dist-profiling/FRONTEND_VERSION
  artifacts:
    paths:
      - dist-profiling/*
    expire_in: 1 days

.buildah:
  image:
    name: $BUILDAH_IMAGE
    entrypoint: ['']
    pull_policy: if-not-present
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
  before_script:
    # Pull docker.io images through GitLab's Dependency Proxy to avoid Docker Hub
    - mkdir -p /etc/containers/registries.conf.d
    - |
      cat > /etc/containers/registries.conf.d/docker-mirror.conf <<EOF
      [[registry]]
      prefix = "docker.io"
      location = "docker.io"
      [[registry.mirror]]
      location = "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
      EOF
    - >
      echo "$CI_DEPENDENCY_PROXY_PASSWORD" |
      buildah login -u "$CI_DEPENDENCY_PROXY_USER"
      --password-stdin "$CI_DEPENDENCY_PROXY_SERVER"
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

container-mr:
  extends: .buildah
  stage: build
  dependencies:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - TAG="${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_IID}_${CI_COMMIT_REF_SLUG}"
    - >
      buildah build
      -f "$CI_PROJECT_DIR/ci/Dockerfile"
      -t "$TAG"
      "$CI_PROJECT_DIR"
    - buildah push --digestfile digest.txt "$TAG"
  artifacts:
    paths:
      - digest.txt
    expire_in: 1 days

container-profiling-mr:
  extends: .buildah
  stage: build
  dependencies:
    - build-profiling
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - TAG="${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_IID}_${CI_COMMIT_REF_SLUG}-profiling"
    - >
      buildah build
      --build-arg DIST_FOLDER=dist-profiling
      -f "$CI_PROJECT_DIR/ci/Dockerfile"
      -t "$TAG"
      "$CI_PROJECT_DIR"
    - buildah push --digestfile ./profiling-digest.txt "$TAG"
  artifacts:
    paths:
      - profiling-digest.txt
    expire_in: 1 days

container:
  extends: .buildah
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - !reference [.build-branch-rules, rules]
  script:
    - >
      buildah build
      --build-arg DIST_FOLDER=dist
      -f "$CI_PROJECT_DIR/ci/Dockerfile"
      -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:8}"
      "$CI_PROJECT_DIR"
    - buildah push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:8}"

container-profiling:
  extends: .buildah
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - >
      buildah build
      --build-arg DIST_FOLDER=dist-profiling
      -f "$CI_PROJECT_DIR/ci/Dockerfile"
      -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:8}-profiling"
      -t "$CI_REGISTRY_IMAGE:profiling"
      "$CI_PROJECT_DIR"
    - buildah push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:8}-profiling"
    - buildah push "$CI_REGISTRY_IMAGE:profiling"

read-tags:
  stage: push
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
  image:
    name: alpine/git:v2.52.0
    entrypoint: ['']
    pull_policy: if-not-present
  artifacts:
    reports:
      dotenv: package.env
  script:
    - git fetch --tags
    - TAGS=$(git tag --list | grep "^v[[:digit:]]\+\.[[:digit:]]\+\.[[:digit:]]\+.*$" | sort -V)
    - TAGS=$(echo "$TAGS" | head -n -1 | tr "\n" " ")
    - echo "TAGS=$TAGS" > package.env

container-create-and-push-tags:
  stage: push
  needs:
    - job: read-tags
      optional: true
    - job: container
    - job: container-profiling
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - !reference [.build-branch-rules, rules]
  image:
    name: $SKOPEO_IMAGE
    entrypoint: ['']
    pull_policy: if-not-present
  script:
    - TAGS_TO_PUSH=$(./ci/create-container-tags.sh "$CI_COMMIT_TAG" "$TAGS" "$CI_COMMIT_BRANCH" "$CI_DEFAULT_BRANCH")
    - |
      for tag in $TAGS_TO_PUSH; do
        SRC_TAG="${CI_COMMIT_SHA:0:8}"
        if [[ $tag == *"-profiling" ]]; then
           SRC_TAG="${CI_COMMIT_SHA:0:8}-profiling"
        fi
        skopeo copy \
        --src-creds="${CI_REGISTRY_USER}":"${CI_REGISTRY_PASSWORD}" \
        --dest-creds="${CI_REGISTRY_USER}":"${CI_REGISTRY_PASSWORD}" \
        "docker://${CI_REGISTRY_IMAGE}:${SRC_TAG}" "docker://${CI_REGISTRY_IMAGE}:$tag"
      done
    - echo "TAGS=$TAGS_TO_PUSH" > package.env
  artifacts:
    reports:
      dotenv: package.env

push-and-sign-images-to-harbor:
  needs:
    - container-create-and-push-tags
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  stage: push
  variables:
    PIPELINE_FULL_IMAGE_NAME: $CI_REGISTRY_IMAGE
    PIPELINE_NAMESPACE_SUFFIX: web-frontend
    PIPELINE_TAGS: $TAGS
  trigger:
    project: opentalk/opentalk-devops/push-and-sign-images-for-the-opentalk-namespace
    strategy: depend
    forward:
      pipeline_variables: true

read-trivy-ignore-file:
  stage: scan
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  script:
    - echo "TRIVY_IGNORE_STR=$(
         cat $CI_PROJECT_DIR/.trivyignore | sed -n 'H;${x;s/^\n//;s/\n/\\n/g;p}'
      )"  > package.env
  artifacts:
    reports:
      dotenv: package.env

container-scanning:
  needs:
    - container
    - read-trivy-ignore-file
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  stage: scan
  variables:
    PIPELINE_FULL_IMAGE_NAME: $CI_REGISTRY_IMAGE:dev
    PIPELINE_PROJECT_WITH_NAMESPACE: $CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    PIPELINE_ADDITIONAL_LABELS: Frontend::Web App
    PIPELINE_TRIVY_IGNORE_FILE_STR_VAR: TRIVY_IGNORE_STR
  trigger:
    project: opentalk/opentalk-devops/scan-container
    strategy: depend
    forward:
      pipeline_variables: true

run-full-e2e-tests:
  # when: manual
  allow_failure: true
  needs:
    - container-mr
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  stage: e2e
  variables:
    FRONTEND_TAG: ${CI_MERGE_REQUEST_IID}_${CI_COMMIT_REF_SLUG}
  trigger:
    project: opentalk/qa/e2e-tests
    strategy: depend
    forward:
      pipeline_variables: true

deploy:
  stage: review-app
  needs:
    - container-mr
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  image:
    name: alpine/helm:4.1.1
    pull_policy: if-not-present
  tags:
    - kubernetes
  before_script:
    - helm repo add --username gitlab-ci-token --password ${CI_JOB_TOKEN}
      opentalk https://git.opentalk.dev/api/v4/projects/649/packages/helm/testing
  script:
    - DIGEST=$(cat "./digest.txt")
    - helm uninstall frontend-$CI_MERGE_REQUEST_IID -n review-latest || true
    - >
      helm upgrade --install --version 5.4.5 --force-replace frontend-$CI_MERGE_REQUEST_IID opentalk/opentalk-helm
      --set tags.standard=false
      --set tags.webapp=true
      --set webapp.image.pullPolicy=IfNotPresent
      --set webapp.image.registry=$CI_REGISTRY
      --set webapp.image.repository=$CI_PROJECT_PATH
      --set webapp.image.tag="@$DIGEST"
      --set webapp.imagePullSecrets[0].name=git
      --set 'webapp.ingress.annotations.kubernetes\.io/tls-acme=null'
      --set 'webapp.ingress.annotations.cert-manager\.io/cluster-issuer=null'
      --set webapp.ingress.enabled=true
      --set webapp.ingress.className=traefik
      --set webapp.ingress.tls[0].secretNameOverride=review-latest-tls
      --set global.defaultWebServiceProtocol=https
      --set global.webapp.domain=$CI_MERGE_REQUEST_IID.review-latest.kube.opentalk.run
      --set global.livekit.domain=livekit.review-latest.kube.opentalk.run
      --set global.oidc.baseUrl=https://accounts.review-latest.kube.opentalk.run/auth
      --set global.oidc.realm=opentalk
      --set global.oidc.webapp.clientId=Webapp
      --set global.backend.domain=controller.review-latest.kube.opentalk.run
      --set global.storeKeysInSecret=false
      --set webapp.ndtDomain=ndt.mailbox.org
      --set webapp.errorReportDomain=opentalk.eu
      --set webapp.imprintUrl=https://opentalk.eu/en/terms-of-use
      --set webapp.dataProtectionUrl=https://opentalk.eu/en/data-protection
      --set webapp.helpdeskUrl=https://opentalk.eu/docs/user/
      --set webapp.contactSupportUrl=https://opentalk.eu/en/contact-our-support-team
      --set webapp.sentryDsn=$SENTRY_DSN_TESTING
      --set webapp.livekit.domain=livekit.review-latest.kube.opentalk.run
      --set keycloak.enabled=false
      --set keycloak.externalPostgresEnabled=false
      --set rabbitmq.enabled=false
      --set livekitserver.enabled=false
      --set valkey.enabled=false
      --set redis.enabled=false
      --set recorder.enabled=false
      --set mailer.enabled=false
      --set obelisk.enabled=false
      --set etherpad.enabled=false
      --set whiteboard.enabled=false
      --set roomserver.enabled=false
      --set-string
      'webapp.ingress.annotations.traefik\.ingress\.kubernetes\.io/router\.middlewares=review-latest-auth@kubernetescrd'
      -n review-latest --wait
    - echo "https://${BASIC_AUTH_USER}:${BASIC_AUTH_PASS}@${CI_MERGE_REQUEST_IID}.review-latest.kube.opentalk.run"

review-app:
  stage: cleanup
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $CI_PROJECT_ROOT_NAMESPACE == 'opentalk' &&
        $CI_PIPELINE_SOURCE == 'push'
  image:
    name: alpine/helm:4.1.4
    entrypoint: ['']
    pull_policy: if-not-present
  tags:
    - kubernetes
  before_script:
    - apk add --no-cache --update curl
    - apk add --no-cache jq
    - apk add --no-cache kubectl
  script:
    - API_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/merge_requests"
    - |
      MERGE_REQUEST_IID=$(curl --silent --fail --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${API_URL}" \
        | jq 'map(select(.state == "merged")) | .[0].iid // empty')
    - echo "MERGE_REQUEST_IID=${MERGE_REQUEST_IID}"
    - |
      if [ -z "${MERGE_REQUEST_IID}" ]; then
        echo "No merged MR associated with ${CI_COMMIT_SHA}; nothing to clean up."
        exit 0
      fi
    - helm uninstall frontend-${MERGE_REQUEST_IID} -n review-latest --ignore-not-found
